<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament invite · Uber Padel</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/uberpadel-icon.svg">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/tournaments/css/tournaments.css">
</head>
<body class="tournaments-page">

<header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <img src="/uberpadel-logo.svg" alt="Uber Padel" class="h-8" onerror="this.style.display='none'">
            <span class="font-bold text-gray-900">Uber Padel</span>
        </a>
    </div>
</header>

<main class="max-w-xl mx-auto px-4 sm:px-6 py-10">
    <div id="root">
        <div class="text-center py-8 text-gray-500">Checking invite…</div>
    </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>

<script>
(async () => {
    const firebaseConfig = {
        apiKey: "AIzaSyDYIlRS_me7sy7ptNmRrvPQCeXP2H-hHzU",
        authDomain: "stretford-padel-tournament.firebaseapp.com",
        databaseURL: "https://stretford-padel-tournament-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "stretford-padel-tournament",
        storageBucket: "stretford-padel-tournament.firebasestorage.app",
        messagingSenderId: "596263602058",
        appId: "1:596263602058:web:f69f7f8d00c60abbd0aa73"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const root = document.getElementById('root');
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
        root.innerHTML = errorCard('Missing token', 'This invite link is incomplete.');
        return;
    }

    const fns = firebase.app().functions('europe-west1');
    const validate = fns.httpsCallable('validateInviteToken');
    const redeem   = fns.httpsCallable('redeemInviteToken');

    let validation;
    try {
        const r = await validate({ token });
        validation = r.data || r;
    } catch (err) {
        root.innerHTML = errorCard('Invite check failed', err.message || String(err));
        return;
    }
    if (!validation?.valid) {
        root.innerHTML = errorCard('This invite is not valid',
            validation?.reason === 'expired' ? 'It has expired.'
          : validation?.reason === 'exhausted' ? 'All uses have been claimed.'
          : validation?.reason === 'revoked' ? 'The organiser revoked this link.'
          : 'The link is not recognised.');
        return;
    }

    renderPreview(validation.tournament);

    async function handleContinue() {
        root.innerHTML = '<div class="text-center py-8 text-gray-500">Redeeming…</div>';
        try {
            const r = await redeem({ token });
            const { tournamentId } = r.data || r;
            window.location.assign(`/tournaments/detail.html?id=${encodeURIComponent(tournamentId)}&via=invite`);
        } catch (err) {
            root.innerHTML = errorCard('Could not redeem', err.message || String(err));
        }
    }

    function renderPreview(t) {
        root.innerHTML = `
            <div class="rounded-2xl bg-white border border-gray-200 p-6 shadow-sm">
                <div class="text-xs uppercase tracking-wide text-blue-700 font-semibold mb-1">You've been invited</div>
                <h1 class="text-2xl font-bold text-gray-900 mb-2">${escapeHtml(t.name || 'Untitled tournament')}</h1>
                <dl class="space-y-1 text-sm text-gray-700">
                    ${t.format ? `<div>Format: <strong>${escapeHtml(t.format)}</strong></div>` : ''}
                    ${t.startDate ? `<div>Starts: ${new Date(t.startDate).toLocaleString('en-GB')}</div>` : ''}
                    ${t.venue || t.postcode ? `<div>Location: ${escapeHtml(t.venue || t.postcode)}</div>` : ''}
                    ${t.entryFeeGBP ? `<div>Entry fee: £${t.entryFeeGBP}</div>` : '<div>Entry fee: Free</div>'}
                </dl>
                <button id="continue" class="mt-4 w-full px-5 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700">
                    Continue →
                </button>
            </div>`;
        document.getElementById('continue').addEventListener('click', handleContinue);
    }

    function errorCard(title, body) {
        return `
            <div class="rounded-2xl bg-red-50 border border-red-200 p-6">
                <div class="text-4xl mb-2">🚫</div>
                <h1 class="text-xl font-bold text-red-900 mb-1">${escapeHtml(title)}</h1>
                <p class="text-sm text-red-800 mb-4">${escapeHtml(body)}</p>
                <a href="/tournaments/browse.html" class="inline-block px-4 py-2 bg-red-600 text-white rounded-lg font-semibold">Browse open tournaments</a>
            </div>`;
    }
    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
})();
</script>
    <script src="/shared/staging-banner.js"></script>
</body>
</html>
