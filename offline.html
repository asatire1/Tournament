<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Uber Padel</title>
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #f9fafb; color: #1f2937;
            text-align: center; padding: 2rem;
        }
        .container { max-width: 400px; }
        .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { color: #6b7280; margin-bottom: 1.5rem; line-height: 1.6; }
        .btn {
            background: #2563EB; color: white; border: none;
            padding: 0.75rem 2rem; border-radius: 0.75rem;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .hint { color: #9ca3af; font-size: 0.8rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🏓</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Pages you've visited before are still available offline.</p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
        <p class="hint">Uber Padel &middot; uberpadel.com</p>
    </div>
</body>
</html>
