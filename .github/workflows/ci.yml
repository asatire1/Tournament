name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Catch a malformed rules file on the PR. Deploying rules needs
      # credentials, but parsing does not — and an unparseable file would
      # otherwise only surface after merge, in Deploy Database Rules.
      - name: Validate database rules
        run: |
          python3 - <<'PY'
          import json, re, sys
          path = 'firebase-rules-production.json'
          raw = open(path).read()
          try:
              rules = json.loads(re.sub(r'//.*', '', raw))['rules']
          except Exception as e:
              sys.exit(f'{path} is not valid JSON: {e}')
          if '.read' not in rules or '.write' not in rules:
              sys.exit(f'{path} is missing a root .read/.write default')
          if rules['.read'] is not False or rules['.write'] is not False:
              sys.exit(f'{path} root must default to deny (.read and .write false)')
          print(f'{path}: valid, {len(rules)} top-level nodes, root defaults to deny')
          PY

      - name: Test
        run: npm test

      - name: Build
        env:
          UBER_FIREBASE_API_KEY: ${{ secrets.UBER_FIREBASE_API_KEY }}
          UBER_FIREBASE_AUTH_DOMAIN: ${{ secrets.UBER_FIREBASE_AUTH_DOMAIN }}
          UBER_FIREBASE_DATABASE_URL: ${{ secrets.UBER_FIREBASE_DATABASE_URL }}
          UBER_FIREBASE_PROJECT_ID: ${{ secrets.UBER_FIREBASE_PROJECT_ID }}
          UBER_FIREBASE_STORAGE_BUCKET: ${{ secrets.UBER_FIREBASE_STORAGE_BUCKET }}
          UBER_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.UBER_FIREBASE_MESSAGING_SENDER_ID }}
          UBER_FIREBASE_APP_ID: ${{ secrets.UBER_FIREBASE_APP_ID }}
          UBER_FIREBASE_MEASUREMENT_ID: ${{ secrets.UBER_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
