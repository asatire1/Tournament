<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Inter Masjid Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Inter Masjid Tournament Jan 26</h1>
            <p class="text-gray-600 mb-6">This tournament has 3 groups. Since the team format supports 2 groups per tournament, we'll create 3 separate group tournaments.</p>

            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="bg-red-50 rounded-xl p-4">
                    <div class="font-semibold text-red-600 mb-2">Group A (9 teams)</div>
                    <ul class="text-sm text-gray-600 space-y-1" id="groupA-list"></ul>
                </div>
                <div class="bg-blue-50 rounded-xl p-4">
                    <div class="font-semibold text-blue-600 mb-2">Group B (9 teams)</div>
                    <ul class="text-sm text-gray-600 space-y-1" id="groupB-list"></ul>
                </div>
                <div class="bg-green-50 rounded-xl p-4">
                    <div class="font-semibold text-green-600 mb-2">Group C (9 teams)</div>
                    <ul class="text-sm text-gray-600 space-y-1" id="groupC-list"></ul>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <button onclick="createGroupTournament('A')" id="btnA" class="py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-semibold transition-all">
                    Create Group A
                </button>
                <button onclick="createGroupTournament('B')" id="btnB" class="py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-semibold transition-all">
                    Create Group B
                </button>
                <button onclick="createGroupTournament('C')" id="btnC" class="py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl font-semibold transition-all">
                    Create Group C
                </button>
            </div>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDYIlRS_me7sy7ptNmRrvPQCeXP2H-hHzU",
            authDomain: "stretford-padel-tournament.firebaseapp.com",
            databaseURL: "https://stretford-padel-tournament-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "stretford-padel-tournament",
            storageBucket: "stretford-padel-tournament.firebasestorage.app",
            messagingSenderId: "596263602058",
            appId: "1:596263602058:web:f69f7f8d00c60abbd0aa73"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Team data
        const groups = {
            A: [
                'Hidaya', 'Masjid Umar Ibn Khattab', 'Salahadeen Al-Ayubi', 'Stanley House',
                'Masjid Ibrahim', 'Cheadle Masjid CMA', 'Mawlawi Kurdish Cultural Centre',
                'Assalaam Centre', 'Dar-us-Salam Longsight'
            ],
            B: [
                'Masjid Bilal', 'Al Marifah Foundation', 'Khanka Naqshbandia', 'Mcdougalls Prayer Hall',
                'Khanka Youth', 'Stockport Muslims', 'Gatley', 'Victoria Park Masjid', 'Makki Masjid'
            ],
            C: [
                'Masjid Hidaya', 'Hough End Masjid', 'Imdadia', 'Goulden Mosque', 'BMA',
                'Madina Masjid', 'Blue Crescent', 'WMA', 'Masjid al falah preston'
            ]
        };

        // Populate lists
        Object.keys(groups).forEach(g => {
            const list = document.getElementById(`group${g}-list`);
            groups[g].forEach(team => {
                const li = document.createElement('li');
                li.textContent = team;
                list.appendChild(li);
            });
        });

        function generateTournamentId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let id = '';
            for (let i = 0; i < 6; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        function generateRoundRobinFixtures(teamIds) {
            const teams = [...teamIds];
            if (teams.length % 2 === 1) teams.push(-1); // bye

            const rounds = [];
            const numRounds = teams.length - 1;
            const half = teams.length / 2;

            const rotating = teams.slice(1);
            const fixed = teams[0];

            for (let r = 0; r < numRounds; r++) {
                const matches = [];

                // Fixed vs first rotating
                if (rotating[0] !== -1 && fixed !== -1) {
                    matches.push({ team1Id: fixed, team2Id: rotating[0] });
                }

                // Pair from ends
                for (let i = 1; i < half; i++) {
                    const t1 = rotating[i];
                    const t2 = rotating[teams.length - 1 - i];
                    if (t1 !== -1 && t2 !== -1) {
                        matches.push({ team1Id: t1, team2Id: t2 });
                    }
                }

                rounds.push({ round: r + 1, matches });
                rotating.push(rotating.shift()); // rotate
            }

            return rounds;
        }

        async function createGroupTournament(groupName) {
            const btn = document.getElementById(`btn${groupName}`);
            btn.disabled = true;
            btn.textContent = 'Creating...';

            const teamNames = groups[groupName];
            const tournamentId = generateTournamentId();

            // Create teams array in team-league format
            const teams = teamNames.map((name, i) => ({
                id: i + 1,
                name: name,
                player1Name: name,
                player1Rating: 5,
                player2Name: '',
                player2Rating: 5,
                combinedRating: 10,
                group: 'A' // All in "Group A" since this is a single-group tournament
            }));

            const teamIds = teams.map(t => t.id);
            const fixtures = generateRoundRobinFixtures(teamIds);

            // Team-league format data
            const tournamentData = {
                meta: {
                    name: `Inter Masjid Jan 26 - Group ${groupName}`,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                },
                teamCount: teams.length,
                groupMode: 'single_group',
                teams: teams,
                groupA: teamIds,
                groupB: [],
                groupAFixtures: fixtures,
                groupBFixtures: [],
                groupMatchScores: { A: {}, B: {} },
                groupMaxScore: 16,
                knockoutMaxScore: 16,
                semiMaxScore: 16,
                thirdPlaceMaxScore: 16,
                finalMaxScore: 16,
                includeThirdPlace: false,
                knockoutFormat: 'quarter_final',
                knockoutScores: {
                    qf1: { team1Score: null, team2Score: null },
                    qf2: { team1Score: null, team2Score: null },
                    qf3: { team1Score: null, team2Score: null },
                    qf4: { team1Score: null, team2Score: null },
                    sf1: { team1Score: null, team2Score: null },
                    sf2: { team1Score: null, team2Score: null },
                    thirdPlace: { team1Score: null, team2Score: null },
                    final: { team1Score: null, team2Score: null }
                },
                knockoutTeams: {
                    qf1: { team1: null, team2: null },
                    qf2: { team1: null, team2: null },
                    qf3: { team1: null, team2: null },
                    qf4: { team1: null, team2: null },
                    sf1: { team1: null, team2: null },
                    sf2: { team1: null, team2: null },
                    thirdPlace: { team1: null, team2: null },
                    final: { team1: null, team2: null }
                }
            };

            try {
                await database.ref(`team-tournaments/${tournamentId}`).set(tournamentData);
                localStorage.setItem(`team_organizer_${tournamentId}`, 'true');

                const colors = { A: 'red', B: 'blue', C: 'green' };
                btn.textContent = `✅ Group ${groupName} Created`;
                btn.classList.remove(`bg-${colors[groupName]}-500`, `hover:bg-${colors[groupName]}-600`);
                btn.classList.add('bg-gray-400');

                const results = document.getElementById('results');
                results.innerHTML += `
                    <div class="bg-${colors[groupName]}-50 rounded-xl p-4 border border-${colors[groupName]}-200">
                        <div class="font-semibold text-${colors[groupName]}-700 mb-2">Group ${groupName} Created!</div>
                        <div class="text-sm text-gray-600 mb-2">Code: <span class="font-mono font-bold">${tournamentId.toUpperCase()}</span></div>
                        <a href="./quick-play/team-league/#/t/${tournamentId}" target="_blank"
                           class="inline-block px-4 py-2 bg-${colors[groupName]}-500 text-white rounded-lg text-sm font-medium hover:bg-${colors[groupName]}-600">
                            Open Group ${groupName} →
                        </a>
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
                btn.textContent = `Error - Try Again`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
